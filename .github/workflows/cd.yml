name: CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify deployment commit
        id: candidate
        run: bun .github/scripts/production-release.ts check
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install dependencies
        if: steps.candidate.outputs.deploy == 'true'
        run: bun install --frozen-lockfile
      - name: Build verified commit
        if: steps.candidate.outputs.deploy == 'true'
        run: bun run build
      - name: Deploy production
        if: steps.candidate.outputs.deploy == 'true'
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production health
        if: steps.candidate.outputs.deploy == 'true'
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors --max-time 15 \
            https://teamplanet.cloby.co/v1/health --output "$RUNNER_TEMP/production-health.json"
          jq --exit-status '.service == "teamplanet-api" and .status == "ok"' "$RUNNER_TEMP/production-health.json"
      - name: Publish production release
        if: steps.candidate.outputs.deploy == 'true'
        run: bun .github/scripts/production-release.ts publish
        env:
          GH_TOKEN: ${{ github.token }}
